<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#132033"/>
      <stop offset="1" stop-color="#0a0f1a"/>
    </linearGradient>
    <linearGradient id="board" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c3352"/>
      <stop offset="1" stop-color="#15263e"/>
    </linearGradient>
    <linearGradient id="bars" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#5eead4"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#f6b53c"/>
    </linearGradient>
  </defs>

  <!-- rounded tile -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#bg)"/>
  <rect x="16.5" y="16.5" width="479" height="479" rx="95.5" fill="none" stroke="#2dd4bf" stroke-opacity="0.35" stroke-width="3"/>

  <!-- GPU board -->
  <g>
    <rect x="86" y="150" width="340" height="212" rx="26" fill="url(#board)" stroke="#2dd4bf" stroke-opacity="0.55" stroke-width="4"/>
    <!-- PCIe bracket tab -->
    <rect x="76" y="176" width="18" height="70" rx="6" fill="#20374f"/>
    <!-- PCIe gold fingers -->
    <g fill="#f6b53c" opacity="0.9">
      <rect x="120" y="362" width="26" height="20"/>
      <rect x="156" y="362" width="26" height="20"/>
      <rect x="192" y="362" width="40" height="20"/>
      <rect x="242" y="362" width="26" height="20"/>
    </g>

    <!-- cooling fan -->
    <g transform="translate(186 256)">
      <circle r="70" fill="#0e1c2e" stroke="#2dd4bf" stroke-opacity="0.5" stroke-width="4"/>
      <g fill="#2dd4bf" opacity="0.85">
        <path d="M0 0 C 30 -10 52 -6 60 14 C 34 10 14 8 0 0 Z" transform="rotate(0)"/>
        <path d="M0 0 C 30 -10 52 -6 60 14 C 34 10 14 8 0 0 Z" transform="rotate(72)"/>
        <path d="M0 0 C 30 -10 52 -6 60 14 C 34 10 14 8 0 0 Z" transform="rotate(144)"/>
        <path d="M0 0 C 30 -10 52 -6 60 14 C 34 10 14 8 0 0 Z" transform="rotate(216)"/>
        <path d="M0 0 C 30 -10 52 -6 60 14 C 34 10 14 8 0 0 Z" transform="rotate(288)"/>
      </g>
      <circle r="16" fill="#15263e" stroke="#5eead4" stroke-width="3"/>
    </g>

    <!-- telemetry / VRAM bars -->
    <g transform="translate(300 236)">
      <rect x="0"  y="72" width="22" height="42" rx="4" fill="url(#bars)"/>
      <rect x="30" y="44" width="22" height="70" rx="4" fill="url(#bars)"/>
      <rect x="60" y="16" width="22" height="98" rx="4" fill="url(#bars)"/>
      <!-- monitoring pulse -->
      <path d="M-6 8 L 18 8 L 30 -18 L 46 26 L 58 8 L 92 8" fill="none" stroke="#f6b53c" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
    </g>
  </g>
</svg>
